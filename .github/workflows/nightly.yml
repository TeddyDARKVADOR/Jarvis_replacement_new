# JARVIS Night Shift — phase 1 : le veilleur, sans IA.
# La documentation est le graphe capabilities/graphs/nightshift.json (CLAUDE.md).
#
# Chaque nuit à 03 h 17 (Paris) : les suites du dépôt testables sous Linux et
# ruff, comparées à la dernière nuit mesurée. Le rapport est poussé sur la
# branche orpheline nightshift-data, jamais sur main ; JARVIS l'y lit sans jeton.
#
# Sécurité (plan Night Shift, section 5) : aucun secret. Le job qui exécute le
# code du dépôt n'a qu'un jeton en lecture, qu'il ne conserve pas. Le job qui
# écrit ne récupère ni n'exécute le code du dépôt : il pousse un fichier.
# Arrêt immédiat : onglet Actions → nightly → « Disable workflow ».
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightshift
  cancel-in-progress: false

jobs:
  veille:
    name: Veille — suites et ruff
    # Épinglé : ubuntu-latest passe à Ubuntu 26.04 entre le 19 octobre et le
    # 19 novembre 2026. Un changement d'image passerait pour des régressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.night.outputs.regression }}
    steps:
      - name: Récupérer le dépôt (historique complet, pour nommer les commits suspects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Dépendances (celles du serveur, pyyaml, ruff épinglé)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deployment/requirements-server.txt pyyaml "ruff==0.17.0"

      - name: Dépendances du HUD pour client_desktop (au mieux, environnement à part)
        continue-on-error: true
        run: |
          # Ce que PyQt6-WebEngine et sounddevice chargent à l'import, en mode
          # offscreen : mesuré avec ldd le 2026-10-14 (le runner n'a pas libEGL).
          # Les bibliothèques xcb et wayland ne servent qu'à un vrai affichage.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libportaudio2 \
            libegl1 libgl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libnss3 libnspr4 libasound2t64 libgbm1 libxcb-dri3-0 libxkbfile1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxtst6
          python -m venv --system-site-packages "$RUNNER_TEMP/hud"
          "$RUNNER_TEMP/hud/bin/python" -m pip install PyQt6 PyQt6-WebEngine sounddevice websockets
          echo "NIGHTSHIFT_PYTHON_HUD=$RUNNER_TEMP/hud/bin/python" >> "$GITHUB_ENV"

      - name: Référence (dernière nuit mesurée)
        run: |
          mkdir -p "$RUNNER_TEMP/nightshift"
          if git fetch --quiet origin nightshift-data; then
            git show FETCH_HEAD:baseline.json > "$RUNNER_TEMP/nightshift/baseline.json" 2>/dev/null \
              || echo "Pas encore de baseline.json : première nuit."
          else
            echo "Pas encore de branche nightshift-data : première nuit."
          fi

      - name: La nuit
        id: night
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m nightshift.run
          --out "$RUNNER_TEMP/nightshift"
          --previous "$RUNNER_TEMP/nightshift/baseline.json"
          --github-output
          --fail-on-regression

      - name: Garder le rapport pour le job « rapport »
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightshift-report
          path: |
            ${{ runner.temp }}/nightshift/report.json
            ${{ runner.temp }}/nightshift/report.md
          retention-days: 14
          if-no-files-found: warn

  rapport:
    name: Rapport — branche nightshift-data
    needs: veille
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Récupérer le rapport de la veille
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightshift-report
          path: report

      - name: Pousser sur nightshift-data (jamais sur main)
        env:
          GH_TOKEN: ${{ github.token }}
          VEILLE: ${{ needs.veille.result }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p report
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! jq -e '.schema_version == "jarvis.nightly/1"' report/report.json > /dev/null 2>&1; then
            echo "::warning::La veille n'a pas produit de rapport lisible : rapport de secours."
            NOW="$(TZ=Europe/Paris date -Iseconds)"
            jq -n --arg run "$GITHUB_RUN_ID" --arg url "$RUN_URL" --arg repo "$GITHUB_REPOSITORY" \
              --arg ref "$GITHUB_REF_NAME" --arg ev "$GITHUB_EVENT_NAME" --arg sha "$GITHUB_SHA" \
              --arg res "$VEILLE" --arg now "$NOW" \
              '{schema_version: "jarvis.nightly/1", run_id: $run, run_url: $url, repository: $repo,
                ref: $ref, event: $ev, commit: $sha[0:7], commit_full: $sha, previous: null,
                started_at: $now, finished_at: $now, duration_s: 0, status: "failed",
                summary: ("Nuit sans mesure : le job veille a fini en « " + $res + " » sans rapport."),
                environment: {}, suites: [], regressions: [], repaired: [], preexisting: [],
                lint: {tool: "ruff", available: false}, green_streak: 0, task: null,
                pull_request_url: null, usage: {llm_calls: 0, tokens_in: 0, tokens_out: 0, providers: {}},
                budgets: {max_llm_calls: 0, max_tokens: 0, max_runtime_minutes: 45},
                limitations: ["rapport de secours écrit par le job rapport"]}' > report/report.json
            printf '## JARVIS Night Shift\n\n**Nuit sans mesure** : le job veille a fini en « %s ».\n' "$VEILLE" > report/report.md
          fi
          # Plus de 2 Mo, ce n'est plus un rapport : rien n'est publié.
          test "$(stat -c %s report/report.json)" -lt 2000000

          git init -q data
          cd data
          git config user.name "jarvis-nightshift"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q origin nightshift-data; then
            git checkout -q -b nightshift-data FETCH_HEAD
          else
            git checkout -q --orphan nightshift-data
          fi
          DAY="$(TZ=Europe/Paris date +%F)"
          mkdir -p runs
          cp ../report/report.json "runs/$DAY-$GITHUB_RUN_ID.json"
          # latest.json (lu par JARVIS) et baseline.json (référence de la nuit
          # suivante) ne viennent que de la branche par défaut : un essai lancé
          # à la main sur une branche de test ne laisse sa trace que dans runs/.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            cp ../report/report.json latest.json
            if [ -f ../report/report.md ]; then cp ../report/report.md latest.md; fi
            if jq -e '(.suites | length) > 0' ../report/report.json > /dev/null; then
              cp ../report/report.json baseline.json
            fi
          fi
          git add -A
          git commit -q -m "nightshift : $DAY, run $GITHUB_RUN_ID ($GITHUB_REF_NAME)"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:nightshift-data; then
              echo "Rapport poussé sur la branche nightshift-data." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
            git fetch -q origin nightshift-data && git rebase -q FETCH_HEAD
          done
          echo "::error::Impossible de pousser sur nightshift-data."
          exit 1
